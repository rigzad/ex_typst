[package]
name = "extypst_nif"
version = "0.1.0"
authors = []
edition = "2021"

[lib]
name = "extypst_nif"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.34.0"
typst = { git = "https://github.com/typst/typst" }
typst-library = { git = "https://github.com/typst/typst.git" }

# typst
comemo = "0.4.0"
elsa = "1.10.1"
once_cell = "1"
memmap2 = "0.9.5"
same-file = "1.0.6"
siphasher = "1"
walkdir = "2.5"
dirs = "5.0.1"
